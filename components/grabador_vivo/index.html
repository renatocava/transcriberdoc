<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!--
  Grabador con transcripción en tiempo real, para el informe en vivo
  (components/en_vivo.py, lib/en_vivo.py).

  - Envía el audio (PCM 24 kHz) por WebSocket a OpenAI (`gpt-live-transcribe`)
    con la clave temporal `clave` que da el servidor; las palabras aparecen en
    la caja de texto mientras se dicen.
  - En cada pausa de la voz cierra la frase (input_audio_buffer.commit); la
    transcripción terminada de cada frase va a Python como un turno.
  - Graba además el audio completo (MediaRecorder), que se envía al detener.

  Mensajes a Python (setComponentValue):
    {evento: "inicio", sesion}
    {evento: "turnos", sesion, turnos}
    {evento: "fin", sesion, turnos, total, audio, mime}
  Cada turno es {seq, texto, inicio, fin} (segundos desde el inicio). Se
  mandan siempre todos: si Streamlit se salta un mensaje, el siguiente lo trae.
  `total` es el número de frases cerradas; si a Python le falta alguna,
  procesa el audio completo como antes.

  Con `simulado` (lista de textos, modo USE_MOCK) no se conecta a nada: va
  "dictando" esos textos para probar la interfaz sin APIs.
-->
<style>
  body { margin: 0; font-family: "Source Sans Pro", "Source Sans 3", sans-serif; color: #0F172A; }
  button {
    width: 100%; padding: 0.55rem 0.75rem; border-radius: 0.5rem; border: 1px solid #CBD5E1;
    background: #FFFFFF; color: #0F172A; font: inherit; font-size: 1rem; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: #0EA5E9; color: #0369A1; }
  button:disabled { opacity: 0.6; cursor: default; }
  button.grabando { background: #FEF2F2; border-color: #F87171; color: #991B1B; }
  .fila { display: flex; align-items: center; gap: 0.6rem; margin-top: 0.5rem; font-size: 0.85rem; color: #475569; }
  .punto { width: 0.6rem; height: 0.6rem; border-radius: 50%; background: #DC2626; animation: latido 1.2s infinite; }
  @keyframes latido { 50% { opacity: 0.25; } }
  .nivel { flex: 1; height: 6px; background: #E2E8F0; border-radius: 3px; overflow: hidden; }
  .nivel div { height: 100%; width: 0; background: #0EA5E9; transition: width 0.08s linear; }
  .aviso { color: #92400E; }
  .error { color: #B91C1C; }
  .titulo { margin: 1rem 0 0.4rem; font-weight: 600; font-size: 1rem; }
  .caja {
    height: 230px; overflow-y: auto; padding: 0.6rem 0.75rem; border: 1px solid #E2E8F0;
    border-radius: 0.5rem; background: #F8FAFC; font-size: 0.95rem; line-height: 1.45;
  }
  .caja p { margin: 0 0 0.45rem; }
  .caja .vacia { color: #94A3B8; font-size: 0.85rem; }
  .caja .curso { color: #64748B; }
  .caja .curso::after { content: "▍"; color: #0EA5E9; animation: latido 1s infinite; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<button id="boton">🎙️&nbsp; Iniciar grabación</button>
<div class="fila" id="info" hidden>
  <span class="punto"></span><span id="reloj">00:00</span>
  <div class="nivel"><div id="barra"></div></div>
  <span id="estado"></span>
</div>
<div class="fila" id="mensaje" hidden></div>
<div id="vivo" hidden>
  <div class="titulo">💬 En vivo</div>
  <div class="caja" id="caja"><p class="vacia">Las palabras aparecen aquí mientras hablas.</p></div>
</div>
<script>
const TASA = 24000;              // Hz que pide la transcripción en tiempo real
const PAUSA_CIERRE = 0.7;        // s de pausa para cerrar una frase (menos corta medidas: «cuatro punto… cinco»)
const FRASE_MIN = 1.0;           // s mínimos de una frase
const FRASE_MAX = 15;            // s: si no hay pausa, se cierra igual
const UMBRAL_MIN = 0.004;        // RMS por debajo del cual nunca es voz
const ESPERA_FIN = 8000;         // ms máximos esperando las últimas frases al detener

let opciones = { clave: null, simulado: null, aviso: null };
let g = null;                    // grabación en curso

const $ = (id) => document.getElementById(id);
const boton = $("boton");

// ---- Protocolo de componentes de Streamlit (v1), sin dependencias -------------
function enviar(type, datos) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, datos), "*");
}
const valor = (v) => enviar("streamlit:setComponentValue", { value: v, dataType: "json" });
const altura = () => enviar("streamlit:setFrameHeight", { height: document.body.scrollHeight + 4 });

window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "streamlit:render") {
    Object.assign(opciones, e.data.args || {});
    if (!g) {
      boton.disabled = !!e.data.disabled;
      mensaje(opciones.aviso || "", "aviso");
    }
    altura();
  }
});
enviar("streamlit:componentReady", { apiVersion: 1 });

// ---- Utilidades ---------------------------------------------------------------
function base64(bytes) {
  let s = "";
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}

function idSesion() {
  return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(16).slice(2);
}

function mensaje(texto, clase) {
  const m = $("mensaje");
  m.textContent = texto;
  m.className = "fila " + (clase || "");
  m.hidden = !texto;
  altura();
}

// ---- Frases -------------------------------------------------------------------
/** La frase de un item de OpenAI (o simulado); se crea al primer evento que lo nombra. */
function frase(id) {
  if (!g.frases.has(id)) {
    g.frases.set(id, { texto: "", final: false, seq: null, inicio: 0, fin: 0 });
    g.orden.push(id);
  }
  return g.frases.get(id);
}

function turnos() {
  return g.orden.map((id) => g.frases.get(id))
    .filter((f) => f.final && f.seq !== null)
    .sort((a, b) => a.seq - b.seq)
    .map((f) => ({ seq: f.seq, texto: f.texto, inicio: f.inicio, fin: f.fin }));
}

function pintar() {
  const caja = $("caja");
  const conTexto = g.orden.map((id) => g.frases.get(id)).filter((f) => f.texto.trim());
  if (!conTexto.length) return;
  caja.replaceChildren(...conTexto.map((f) => {
    const p = document.createElement("p");
    p.textContent = f.texto.trim();
    if (!f.final) p.className = "curso";
    return p;
  }));
  caja.scrollTop = caja.scrollHeight;
}

function frasesListas() {
  return g.pendientes.length === 0 && g.orden.every((id) => {
    const f = g.frases.get(id);
    return f.seq === null || f.final;
  });
}

function avisarTurnos() {
  if (g.terminando) return;           // al detener, los turnos van con "fin"
  valor({ evento: "turnos", sesion: g.sesion, turnos: turnos() });
}

// ---- Transcripción en tiempo real (OpenAI) -------------------------------------
function conectar(clave) {
  const ws = new WebSocket("wss://api.openai.com/v1/realtime", ["realtime", "openai-insecure-api-key." + clave]);
  ws.onopen = () => {
    $("estado").textContent = "transcribiendo en vivo";
    for (const trozo of g.cola) ws.send(trozo);
    g.cola = [];
  };
  ws.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    if (ev.type === "input_audio_buffer.committed") {
      const f = frase(ev.item_id), p = g.pendientes.shift() || { inicio: 0, fin: 0 };
      f.seq = g.cerradas++;
      f.inicio = p.inicio; f.fin = p.fin;
      if (f.final) avisarTurnos();
    } else if (ev.type === "conversation.item.input_audio_transcription.delta") {
      frase(ev.item_id).texto += ev.delta || "";
      pintar();
    } else if (ev.type === "conversation.item.input_audio_transcription.completed") {
      const f = frase(ev.item_id);
      f.texto = ev.transcript || "";
      f.final = true;
      pintar();
      if (f.seq !== null) avisarTurnos();
    } else if (ev.type === "conversation.item.input_audio_transcription.failed") {
      frase(ev.item_id).final = true;   // sin texto: Python procesará el audio completo
      g.fallidas++;
    } else if (ev.type === "error") {
      g.fallidas++;
      mensaje("Transcripción en vivo: " + ((ev.error && ev.error.message) || "error") +
        ". Se sigue grabando; el informe se llenará al detener.", "error");
    }
  };
  ws.onclose = () => { if (g && !g.terminando) $("estado").textContent = "sin conexión"; };
  ws.onerror = () => {
    if (g) g.fallidas++;
    mensaje("Se cortó la transcripción en vivo. Se sigue grabando; el informe se llenará al detener.", "error");
  };
  return ws;
}

function mandarAudio(muestras) {
  const pcm = new Int16Array(muestras.length);
  for (let i = 0; i < muestras.length; i++) {
    const m = Math.max(-1, Math.min(1, muestras[i]));
    pcm[i] = m < 0 ? m * 0x8000 : m * 0x7fff;
  }
  const msg = JSON.stringify({ type: "input_audio_buffer.append", audio: base64(new Uint8Array(pcm.buffer)) });
  if (g.ws && g.ws.readyState === WebSocket.OPEN) g.ws.send(msg);
  else if (g.ws && g.ws.readyState === WebSocket.CONNECTING) g.cola.push(msg);
}

function cerrarFrase() {
  if (!g.ws || g.ws.readyState !== WebSocket.OPEN) return;
  g.ws.send(JSON.stringify({ type: "input_audio_buffer.commit" }));
  g.pendientes.push({ inicio: g.inicioFrase / TASA, fin: g.muestras / TASA });
  g.inicioFrase = g.muestras;
  g.huboVoz = false;
}

// ---- Audio --------------------------------------------------------------------
function procesar(x, tasaEntrada) {
  let suma = 0;
  for (let i = 0; i < x.length; i++) suma += x[i] * x[i];
  const rms = Math.sqrt(suma / x.length);
  g.bloques++;

  // Baja a 24 kHz promediando cada tramo (evita el aliasing de tomar una de cada n).
  const paso = tasaEntrada / TASA, salida = [];
  while (g.pos < x.length) {
    const a = Math.floor(g.pos), b = Math.max(a + 1, Math.min(x.length, Math.floor(g.pos + paso)));
    let s = 0;
    for (let k = a; k < b; k++) s += x[k];
    salida.push(s / (b - a));
    g.pos += paso;
  }
  g.pos -= x.length;
  g.muestras += salida.length;
  mandarAudio(salida);

  // Piso de ruido: baja rápido, sube despacio. Es voz lo que lo supera con holgura.
  g.piso = rms < g.piso ? rms : g.piso * 1.003 + 1e-6;
  if (rms > Math.max(UMBRAL_MIN, g.piso * 3)) {
    g.ultimaVoz = g.muestras;
    g.huboVoz = true;
  }
  $("barra").style.width = Math.min(100, rms * 300) + "%";

  const dur = (g.muestras - g.inicioFrase) / TASA, pausa = (g.muestras - g.ultimaVoz) / TASA;
  if (g.huboVoz && ((dur >= FRASE_MIN && pausa >= PAUSA_CIERRE) || dur >= FRASE_MAX)) cerrarFrase();
}

// ---- Modo simulado (sin APIs) ---------------------------------------------------
function simular(textos) {
  $("estado").textContent = "simulado";
  let i = 0;
  const siguiente = () => {
    if (!g || g.terminando || i >= textos.length) return;
    const id = "sim" + i, palabras = textos[i].split(" "), f = frase(id), inicio = (Date.now() - g.comienzo) / 1000;
    i++;
    let k = 0;
    const escribir = setInterval(() => {
      if (!g || g.terminando) return clearInterval(escribir);
      f.texto = palabras.slice(0, ++k).join(" ");
      pintar();
      if (k >= palabras.length) {
        clearInterval(escribir);
        Object.assign(f, { final: true, seq: g.cerradas++, inicio, fin: (Date.now() - g.comienzo) / 1000 });
        pintar();
        avisarTurnos();
        g.simulacion = setTimeout(siguiente, 900);
      }
    }, 90);
  };
  g.simulacion = setTimeout(siguiente, 600);
}

// ---- Grabación ----------------------------------------------------------------
async function iniciar() {
  mensaje("");
  // El contexto de audio se crea aquí, todavía dentro del clic: si se creara tras
  // esperar el permiso del micrófono, Chrome lo dejaría suspendido.
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
    });
  } catch (e) {
    mensaje(window.isSecureContext
      ? "No se pudo usar el micrófono: " + (e.message || e.name) + ". Revisa el permiso del navegador."
      : "El navegador solo permite el micrófono con HTTPS (o en localhost).", "error");
    ctx.close();
    return;
  }
  if (ctx.state !== "running") {
    try { await ctx.resume(); } catch (e) { /* lo detecta el control de abajo */ }
  }
  const fuente = ctx.createMediaStreamSource(stream);
  const proc = ctx.createScriptProcessor(4096, 1, 1);
  const mudo = ctx.createGain();
  mudo.gain.value = 0;               // el procesador necesita una salida, pero no debe oírse
  fuente.connect(proc); proc.connect(mudo); mudo.connect(ctx.destination);

  const tipos = ["audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus", "audio/mp4"];
  const mime = tipos.find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
  const rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);

  g = {
    sesion: idSesion(), stream, ctx, proc, rec, trozos: [], comienzo: Date.now(), ws: null, cola: [],
    pos: 0, muestras: 0, inicioFrase: 0, ultimaVoz: 0, huboVoz: false, piso: 0.002, bloques: 0,
    frases: new Map(), orden: [], pendientes: [], cerradas: 0, fallidas: 0, terminando: false,
  };
  rec.ondataavailable = (e) => { if (e.data && e.data.size) g.trozos.push(e.data); };
  rec.start(1000);
  proc.onaudioprocess = (e) => procesar(e.inputBuffer.getChannelData(0), ctx.sampleRate);

  if (opciones.simulado) simular(opciones.simulado);
  else if (opciones.clave) g.ws = conectar(opciones.clave);
  else $("estado").textContent = "sin transcripción en vivo";

  g.reloj = setInterval(() => {
    const s = Math.floor((Date.now() - g.comienzo) / 1000);
    $("reloj").textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  }, 500);

  boton.textContent = "⏹️  Detener grabación";
  boton.classList.add("grabando");
  $("info").hidden = false;
  $("vivo").hidden = !(opciones.clave || opciones.simulado);
  // Si el audio no llega al procesador, se graba igual, pero no habrá texto en vivo.
  const actual = g;
  setTimeout(() => {
    if (g === actual && actual.bloques === 0) {
      ctx.resume().catch(() => {});
      mensaje("El navegador no entrega el audio para el modo en vivo (" + ctx.state +
        "): se sigue grabando y el informe se llenará al detener.", "error");
    }
  }, 2500);
  altura();
  valor({ evento: "inicio", sesion: g.sesion });
}

function detener() {
  const actual = g;
  actual.proc.onaudioprocess = null;
  actual.proc.disconnect();
  clearInterval(actual.reloj);
  clearTimeout(actual.simulacion);
  if (actual.huboVoz) cerrarFrase();   // la última frase, aunque no haya pausa
  actual.terminando = true;
  boton.disabled = true;
  boton.classList.remove("grabando");
  boton.textContent = "Terminando el informe…";
  $("info").hidden = true;

  // Espera a que lleguen las últimas frases, con un tope.
  const limite = Date.now() + ESPERA_FIN;
  const esperar = new Promise((listo) => {
    const mirar = () => (frasesListas() || Date.now() > limite) ? listo() : setTimeout(mirar, 100);
    mirar();
  });
  const grabado = new Promise((listo) => { actual.rec.onstop = listo; });
  actual.rec.stop();

  Promise.all([esperar, grabado]).then(async () => {
    if (actual.ws) actual.ws.close();
    const blob = new Blob(actual.trozos, { type: actual.rec.mimeType || "audio/webm" });
    const audio = base64(new Uint8Array(await blob.arrayBuffer()));
    actual.stream.getTracks().forEach((t) => t.stop());
    actual.ctx.close();
    valor({
      evento: "fin", sesion: actual.sesion, turnos: turnos(),
      // Una falla (o frases sin terminar) hace que Python procese el audio completo.
      total: actual.fallidas || !frasesListas() ? actual.cerradas + 1 : actual.cerradas,
      audio, mime: blob.type,
    });
  });
}

boton.addEventListener("click", () => {
  if (!g) iniciar();
  else if (!boton.disabled) detener();
});
altura();
</script>
</body>
</html>
